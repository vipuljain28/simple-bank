[project]
name = "simple-bank-api"
version = "0.1.0"
description = "Simple Bank fund transfer API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.34,<1",
    "argon2-cffi>=23.1,<26",
    "phonenumbers>=8.13,<10",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_bank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]