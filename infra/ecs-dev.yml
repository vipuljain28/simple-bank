AWSTemplateFormatVersion: "2010-09-09"
Description: Development-only ECS Fargate deployment for the Simple Bank API.

Parameters:
  ImageUri:
    Type: String
    Description: Full ECR image URI, including tag.
  CloudFrontOriginPrefixListId:
    Type: String
    Default: pl-fab65393
    Description: AWS-managed CloudFront origin-facing prefix list for this region.
  EcrRepositoryName:
    Type: String
    Default: itc/fastapi-demo-vipul
  GitHubOwner:
    Type: String
    Default: vipuljain28
  GitHubRepository:
    Type: String
    Default: simple-bank
  GitHubBranch:
    Type: String
    Default: main

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: simple-bank-dev

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: simple-bank-dev-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.2.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: simple-bank-dev-public-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  ApiLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow only CloudFront origin traffic to reach the API load balancer.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontOriginPrefixListId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  ApiTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow API traffic only from the load balancer.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !GetAtt ApiLoadBalancerSecurityGroup.GroupId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  ApiLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !GetAtt ApiLoadBalancerSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: simple-bank-dev-api

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Vpc
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"

  ApiHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApiLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  OriginAccessSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Shared origin-verification value for CloudFront and the ALB WAF.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: simple-bank-dev

  ApiOriginWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: simple-bank-dev-cloudfront-origin
      Scope: REGIONAL
      DefaultAction:
        Block: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: simple-bank-dev-origin
        SampledRequestsEnabled: false
      Rules:
        - Name: AllowVerifiedCloudFrontOrigin
          Priority: 0
          Action:
            Allow: {}
          Statement:
            ByteMatchStatement:
              FieldToMatch:
                SingleHeader:
                  Name: x-origin-verify
              PositionalConstraint: EXACTLY
              SearchString: !GetAtt OriginAccessSecret.SecretString
              TextTransformations:
                - Priority: 0
                  Type: NONE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: simple-bank-dev-verified-cloudfront
            SampledRequestsEnabled: false

  ApiOriginWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref ApiLoadBalancer
      WebACLArn: !GetAtt ApiOriginWebAcl.Arn

  ApiCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Public HTTPS dev endpoint for the Simple Bank API.
        PriceClass: PriceClass_100
        Origins:
          - Id: simple-bank-dev-api-origin
            DomainName: !GetAtt ApiLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginSSLProtocols:
                - TLSv1.2
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !GetAtt OriginAccessSecret.SecretString
        DefaultCacheBehavior:
          TargetOriginId: simple-bank-dev-api-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Application
          Value: simple-bank-dev

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/simple-bank-dev-api
      RetentionInDays: 14

  AuthCodePepper:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Generated development auth-code pepper for Simple Bank.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: simple-bank-dev

  ApiTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadAuthCodePepper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AuthCodePepper

  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: simple-bank-dev-api
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt ApiTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      ContainerDefinitions:
        - Name: simple-bank-api
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: DATABASE_URL
              Value: sqlite://
            - Name: SQLITE_CREATE_SCHEMA
              Value: "true"
            - Name: SESSION_COOKIE_SECURE
              Value: "true"
            - Name: SESSION_COOKIE_SAMESITE
              Value: lax
            - Name: PUBLIC_ORIGIN
              Value: !Sub https://${ApiCloudFrontDistribution.DomainName}
          Secrets:
            - Name: AUTH_CODE_PEPPER
              ValueFrom: !Ref AuthCodePepper
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  ApiCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: simple-bank-dev

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: ApiHttpListener
    Properties:
      ServiceName: simple-bank-dev-api
      Cluster: !Ref ApiCluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: 0
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !GetAtt ApiTaskSecurityGroup.GroupId
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
      LoadBalancers:
        - ContainerName: simple-bank-api
          ContainerPort: 8000
          TargetGroupArn: !Ref ApiTargetGroup

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: simple-bank-dev-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: DeploySimpleBankDevApi
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeRepositories
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}
              - Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ApiCluster}/simple-bank-dev-api
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ApiTaskExecutionRole.Arn
                  - !GetAtt ApiTaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

Outputs:
  ApiUrl:
    Description: Public HTTPS dev API URL. Do not send real customer or transaction data.
    Value: !Sub https://${ApiCloudFrontDistribution.DomainName}
  EcrRepositoryName:
    Value: !Ref EcrRepositoryName
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubActionsDeployRole.Arn
  EcsClusterName:
    Value: !Ref ApiCluster
  EcsServiceName:
    Value: !Ref ApiService
  EcsTaskFamily:
    Value: simple-bank-dev-api
  EcsContainerName:
    Value: simple-bank-api
